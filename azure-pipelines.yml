variables:
  VM_IMAGE: 'ubuntu-24.04'
  DISTRO_BRANCH: sisyphus
  DISTRO_BRANCH_REPO: 'rpm [alt] http://download.basealt.ru/pub/distributions/ALTLinux Sisyphus'
  DOCKER_IMAGE: ${{ format('library/alt:{0}', variables.DISTRO_BRANCH) }}

schedules:
- cron: "0 23 * * 0"
  displayName: Weekly build
  branches:
    include:
    - $(DISTRO_BRANCH)
  always: true

trigger:
- sisyphus

jobs:
- job: build_and_publish_docker_image
  displayName: Build and publish docker image
  pool:
    vmImage: $(VM_IMAGE)
  strategy:
    matrix:
      Build_Image:
        TARGET: 'build'
      Tests_Image:
        TARGET: 'tests'
  steps:
  - task: Docker@2
    displayName: Login to Docker Hub
    inputs:
      command: login
      containerRegistry: dockerRegistryServiceConnection1

  - task: Docker@2
    displayName: Build docker image
    inputs:
      command: build
      repository: stanislavlevin/freeipa-$(TARGET)-altlinux
      Dockerfile:
        Dockerfile.$(TARGET)
      tags:
        $(DISTRO_BRANCH)
      arguments: >
        --build-arg DISTRO_BRANCH_REPO="$(DISTRO_BRANCH_REPO)"
        --build-context docker_image="docker-image://$(DOCKER_IMAGE)"

  - task: Docker@2
    displayName: Push docker image to registry
    inputs:
      command: push
      repository: stanislavlevin/freeipa-$(TARGET)-altlinux
      tags:
        $(DISTRO_BRANCH)
